name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version label without leading v (e.g. 0.1.0)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build DMG & ZIP
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode.app ]; then
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Install tooling
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Resolve version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.version }}" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.1.0"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Using version $VERSION"

      - name: Generate project
        run: xcodegen generate

      - name: Package DMG + ZIP
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./Scripts/package-dmg.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DevSweep-v${{ steps.version.outputs.version }}
          path: |
            dist/DevSweep-v${{ steps.version.outputs.version }}.dmg
            dist/DevSweep-v${{ steps.version.outputs.version }}.zip
            dist/INSTALL.txt
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: DevSweep v${{ steps.version.outputs.version }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          body: |
            ## DevSweep v${{ steps.version.outputs.version }}

            Native macOS utility for reclaiming space from regeneratable developer folders.

            ### Downloads
            - `DevSweep-v${{ steps.version.outputs.version }}.dmg` — drag into Applications
            - `DevSweep-v${{ steps.version.outputs.version }}.zip` — raw app archive

            ### Unsigned build note
            This release may be unsigned. If Gatekeeper blocks opening:
            1. Right-click **DevSweep** → **Open** → **Open**
            2. Or use **System Settings → Privacy & Security → Open Anyway**

            Selected folders are moved to **Trash** (not permanently deleted).
          files: |
            dist/DevSweep-v${{ steps.version.outputs.version }}.dmg
            dist/DevSweep-v${{ steps.version.outputs.version }}.zip
            dist/INSTALL.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
